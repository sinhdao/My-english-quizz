<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7fb"><title>My English Quiz</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#202538;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:620px;margin:auto;padding:24px 18px 100px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:26px;margin:6px 0}h2{font-size:20px;margin:0 0 14px}p{line-height:1.5;color:#626b80}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:800;color:#6c63bd}button,select,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:12px 16px;font-weight:700;background:#6559ca;color:white}button.secondary{background:#eae9fa;color:#4f45a3}button.ghost{background:white;color:#525c72;border:1px solid #dce0eb}button:disabled{opacity:.45}input,select,textarea{width:100%;padding:12px;border:1px solid #d9deea;border-radius:12px;background:white;margin:5px 0 12px;color:#252b40}label{font-weight:700;font-size:13px}.card{background:white;border:1px solid #e8eaf2;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 6px 24px #22224408}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:15px 8px;text-align:center;background:white;border-radius:16px}.stat strong{display:block;font-size:26px;color:#5247a7}.stat small{font-size:12px;color:#788093}.tabs{display:flex;gap:5px;position:fixed;bottom:0;left:0;right:0;max-width:620px;margin:auto;background:#fff;border-top:1px solid #e4e7ef;padding:10px 8px calc(10px + env(safe-area-inset-bottom));z-index:10}.tabs button{flex:1;padding:10px 3px;background:transparent;color:#6e7588;font-size:12px}.tabs button.active{background:#efedff;color:#554ab5}.stack{display:grid;gap:10px}.wide{width:100%}.muted{color:#7b8396;font-size:13px}.pill{display:inline-block;background:#efedff;color:#544ab0;border-radius:50px;padding:5px 10px;font-size:12px;font-weight:700}.flash{min-height:210px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:linear-gradient(140deg,#f1efff,#fff);border:1px solid #e2ddff;border-radius:20px;padding:24px;cursor:pointer}.flash strong{font-size:24px}.flash p{font-size:17px}.actions{display:flex;gap:8px}.actions button{flex:1}.choice{display:block;text-align:left;width:100%;background:#f6f7fb;color:#283047;border:1px solid #e1e4ed;margin:8px 0}.choice.correct{background:#d9f4e6;border-color:#3aa874}.choice.wrong{background:#ffe7e7;border-color:#e07a7a}.choice:disabled{opacity:1}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.small{font-size:12px}.hidden{display:none}.progress{height:7px;background:#e9e9f3;border-radius:12px;overflow:hidden}.progress div{height:100%;background:#6d61cb;transition:width .2s}.word{padding:13px 0;border-bottom:1px solid #eef0f5}.word:last-child{border:0}.listen-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.listen-actions button{padding:9px 11px;font-size:13px}.listen-note{font-size:12px;color:#626b80;margin-top:8px}.word strong{display:block}.word small{color:#6c7387}.inline{display:flex;gap:8px}.inline>*{flex:1}.danger{color:#b44747}.notice{background:#fff9e9;border:1px solid #f0e0aa;padding:12px;border-radius:12px;font-size:13px;color:#766234}footer{font-size:12px;color:#8a91a2;margin-top:25px}
 .meaning-visual{margin:13px auto;padding:14px 10px;border-radius:17px;background:linear-gradient(135deg,#e8f1ff,#f4ebff);text-align:center;max-width:420px;border:1px solid #dbe5f7}.visual-pair{display:flex;align-items:center;justify-content:center;gap:18px;font-size:54px;line-height:1.35}.visual-arrow{font-size:24px;color:#6578a0}.visual-caption{font-size:13px;color:#344b70;font-weight:600;margin-top:5px} </style></head><body><main><header><div><div class="eyebrow">LEARN A LITTLE, EVERY DAY</div><h1>My English Quiz ✨</h1></div><span class="pill">B1–B2</span></header><p>Ôn từ vựng mọi lúc, mỗi lần chỉ 3–5 phút.</p><div id="app"></div><footer>Dữ liệu lưu trên trình duyệt của thiết bị này. Hãy xuất bản sao lưu định kỳ.</footer></main><nav class="tabs" id="tabs"></nav><script>
const KEY='my-english-quiz-v1';const today=()=>new Date().toLocaleDateString('en-CA');const seed=[
['Hold off on + V-ing','Khoan, trì hoãn việc gì','Hold off on giving advice.','Parenting English'],['Resist the temptation to + V','Kiềm chế sự thôi thúc làm gì','Resist the temptation to interrupt.','Parenting English'],['Acknowledge feelings','Thừa nhận, đón nhận cảm xúc','Acknowledge your child’s feelings.','Parenting English'],["Reflect someone’s feelings",'Phản ánh lại cảm xúc của ai bằng lời nói','Reflect feelings before giving advice.','Parenting English'],["Take someone’s advice",'Nghe theo lời khuyên của ai','If you take my advice, you will feel better.','Parenting English'],['Blame someone else','Đổ lỗi cho người khác','Do not blame someone else.','Parenting English'],['On purpose','Cố ý, có chủ đích','I did not do it on purpose.','Parenting English'],['Work out a solution','Tìm ra cách giải quyết vấn đề','She worked out a solution.','Parenting English'],['Be able to + V','Có khả năng làm gì','I was able to help.','Parenting English'],['Instead of + V-ing','Thay vì làm gì','Instead of giving advice, listen.','Parenting English']].map((x,i)=>({id:'starter-'+i,en:x[0],vi:x[1],ex:x[2],group:x[3],due:today(),level:0,seen:0,correct:0}));
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.cards))data={cards:seed,history:[]};let tab='home',session=null;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Không lưu được trên trình duyệt này. Hãy xuất dữ liệu để sao lưu.')}};save();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const due=c=>!c.due||c.due<=today();const plusDays=n=>{let d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')};const stats=()=>({due:data.cards.filter(due).length,known:data.cards.filter(c=>c.level>=2).length,total:data.cards.length});function nav(){document.getElementById('tabs').innerHTML=[['home','⌂ Trang chủ'],['cards','▤ Flashcards'],['quiz','✓ Quiz'],['words','＋ Kho từ']].map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')};function go(t){stopSpeech();tab=t;session=null;render()};function render(){nav();let s=stats(),a=document.getElementById('app');if(tab==='home')a.innerHTML=`<div class="stats"><div class="stat"><strong>${s.due}</strong><small>Cần ôn</small></div><div class="stat"><strong>${s.known}</strong><small>Đã nhớ</small></div><div class="stat"><strong>${s.total}</strong><small>Tổng từ</small></div></div><div class="card"><h2>Ôn tập hôm nay</h2><p>Nhớ từ bằng cách tự trả lời trước khi xem đáp án. Từ chưa nhớ sẽ xuất hiện sớm hơn.</p><div class="stack"><button onclick="startCards(true)">Ôn từ đến hạn (${s.due})</button><button class="secondary" onclick="startQuiz()">Làm Quiz 5 câu</button></div></div><div class="card"><h2>Nhịp ôn gợi ý</h2><p>Học hôm nay → ôn sau 1 ngày → 3 ngày → 7 ngày → 14 ngày. Từ trả lời sai được đưa về lượt ôn ngày mai.</p><p class="muted">Các bộ từ hiện có: ${[...new Set(data.cards.map(c=>c.group))].map(esc).join(', ')}</p></div>`;
else if(tab==='cards')renderCards(a);else if(tab==='quiz')renderQuiz(a);else renderWords(a)}

const VOCAB_VISUALS={"hold off on + v-ing":["✋","⏳","Tạm dừng trước khi hành động"],"resist the temptation to + v":["🧠","✋","Muốn làm nhưng tự kiềm chế"],"acknowledge feelings":["😢","🤝","Nhận ra và công nhận cảm xúc"],"reflect someone's feelings":["😢","🪞","Phản ánh lại cảm xúc"],"take someone's advice":["💬","✅","Nghe và làm theo lời khuyên"],"blame someone else":["👉","😟","Đổ lỗi cho người khác"],"on purpose":["🎯","✅","Hành động có chủ đích"],"work out a solution":["🧩","💡","Tìm được cách giải quyết"],"be able to + v":["🚧","🏆","Có khả năng vượt qua thử thách"],"instead of + v-ing":["❌","✅","Chọn hành động khác thay thế"],"start up trouble":["😠","⚡","Khơi mào rắc rối"],"knock something down":["🧱","💥","Làm vật đổ xuống"],"be astonished":["😮","✨","Rất ngạc nhiên"],"whether ... or not":["✅","❌","Dù có hay không"],"hadn't + v3 ... yet ...":["⌛","🚫","Đến lúc đó vẫn chưa xảy ra"],"blame someone":["👉","😞","Quy trách nhiệm cho ai"],"acknowledge and reflect feelings":["😢","🪞","Công nhận và phản ánh cảm xúc"],"brush aside":["🗣️","✋","Lời nói bị gạt đi, không được lắng nghe"],"deny feelings":["😢","🚫","Phủ nhận cảm xúc"],"find yourself + v-ing":["😐","😠","Bất chợt nhận thấy mình đang thay đổi"],"more and more + adj":["😐","😡","Mức độ ngày càng tăng"],"start out + v-ing":["🚩","➡️","Trạng thái khi bắt đầu"],"end up + v-ing":["➡️","🏁","Kết quả cuối cùng"],"upset about something":["💉","😢","Buồn bực vì một việc"],"irritated with someone":["😤","💬","Cáu kỉnh với ai đó"],"unreasonable":["🤷","🚫","Đòi hỏi thiếu hợp lý"],"hostile toward someone":["😠","⚡","Thái độ đối đầu"],"accept someone's feelings":["😢","🤗","Đón nhận cảm xúc của người khác"],"sense":["👀","💭","Cảm nhận một điều đang xảy ra"],"interchange":["🗣️","💬","Hai phía trao đổi qua lại"],"genuinely helpful":["🤲","❤️","Giúp đỡ chân thành"],"feel respected":["🧍","🌟","Cảm thấy được tôn trọng"],"bear the pain":["😣","💪","Chịu đựng nỗi đau"],"do someone a great service":["🤝","🌱","Mang lại sự giúp đỡ lớn"],"inner reality":["🧠","❤️","Thế giới cảm xúc bên trong"],"be in touch with":["🧠","❤️","Nhận biết và kết nối với cảm xúc"],"gather the strength":["😔","💪","Tập hợp sức mạnh để tiến lên"],"cope":["🌧️","☂️","Chủ động ứng phó khó khăn"]};
function visualFor(c){
 const k=String(c.en||'').toLowerCase().trim(),v=VOCAB_VISUALS[k];
 if(!v)return '';
 return '<div class="meaning-visual" role="img" aria-label="'+esc(v[2])+'"><div class="visual-pair"><span>'+v[0]+'</span><span class="visual-arrow">→</span><span>'+v[1]+'</span></div><div class="visual-caption">'+esc(v[2])+'</div></div>';
}

function startCards(onlyDue=false){tab='cards';let cards=data.cards.filter(c=>!onlyDue||due(c));session={type:'cards',ids:cards.map(c=>c.id).sort(()=>Math.random()-.5),index:0,flipped:false,done:0};render()};function renderCards(a){if(!session||session.type!=='cards'){a.innerHTML=`<div class="card"><h2>Flashcards</h2><p>Chọn cách ôn, chạm vào thẻ để lật mặt.</p><div class="stack"><button onclick="startCards(true)">Ôn từ đến hạn</button><button class="secondary" onclick="startCards(false)">Ôn tất cả từ</button></div></div>`;return}let q=session;if(q.index>=q.ids.length){a.innerHTML=`<div class="card"><h2>Hoàn thành! 🎉</h2><p>Chị đã ôn ${q.done} từ. Hẹn gặp lại ở lượt tiếp theo.</p><button onclick="go('home')">Về trang chủ</button></div>`;return}let c=data.cards.find(x=>x.id===q.ids[q.index]);a.innerHTML=`<div class="row"><h2>Flashcards</h2><span class="pill">${q.index+1}/${q.ids.length}</span></div><div class="progress"><div style="width:${100*q.index/q.ids.length}%"></div></div><div class="card"><div class="flash" onclick="flip()"><span class="muted">${q.flipped?'NGHĨA TIẾNG VIỆT':'TỪ TIẾNG ANH'}</span><strong>${esc(q.flipped?c.vi:c.en)}</strong>${visualFor(c)}${q.flipped?`<p>${esc(c.ex)}</p>`:'<p class="muted">Chạm để xem nghĩa</p>'}</div><p class="muted">${esc(c.group)}</p>${audioControls("c",c)}${q.flipped?'<div class="actions"><button class="ghost" onclick="rate(false)">✕ Chưa nhớ</button><button onclick="rate(true)">✓ Đã nhớ</button></div>':'<button class="secondary wide" onclick="flip()">Lật thẻ</button>'}</div>`};function flip(){session.flipped=!session.flipped;render()};function rate(ok){let c=data.cards.find(x=>x.id===session.ids[session.index]);c.seen++;if(ok){c.correct++;c.level=Math.min(5,c.level+1)}else c.level=0;c.due=plusDays(ok?[1,3,7,14,30][c.level-1]:1);data.history.push({date:today(),id:c.id,ok,mode:'card'});save();session.index++;session.done++;session.flipped=false;render()}
function startQuiz(){tab='quiz';let pool=[...data.cards].sort(()=>Math.random()-.5);session={type:'quiz',ids:pool.slice(0,Math.min(5,pool.length)).map(c=>c.id),index:0,score:0,selected:null,dir:Math.random()<.5?'en':'vi'};render()};function renderQuiz(a){if(!session||session.type!=='quiz'){a.innerHTML=`<div class="card"><h2>Quiz 5 câu</h2><p>Trắc nghiệm Anh → Việt hoặc Việt → Anh, đổi chiều ngẫu nhiên. Đáp án sai sẽ được ôn lại sớm.</p><button class="wide" onclick="startQuiz()">Bắt đầu Quiz</button></div>`;return}let q=session;if(q.index>=q.ids.length){a.innerHTML=`<div class="card"><h2>Kết quả: ${q.score}/${q.ids.length} 🎯</h2><p>${q.score===q.ids.length?'Xuất sắc!':'Các từ chưa nhớ đã được đưa vào lịch ôn sớm.'}</p><div class="stack"><button onclick="startQuiz()">Làm Quiz mới</button><button class="secondary" onclick="go('home')">Về trang chủ</button></div></div>`;return}let c=data.cards.find(x=>x.id===q.ids[q.index]);if(!q.options){let key=q.dir==='en'?'vi':'en';q.options=[c,...data.cards.filter(x=>x.id!==c.id).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5).map(x=>({id:x.id,text:x[key]}))}a.innerHTML=`<div class="row"><h2>Quick Quiz</h2><span class="pill">${q.index+1}/${q.ids.length}</span></div><div class="progress"><div style="width:${100*q.index/q.ids.length}%"></div></div><div class="card"><p class="muted">${q.dir==='en'?'Chọn nghĩa tiếng Việt':'Chọn từ tiếng Anh'}:</p><h2>${esc(c[q.dir])}</h2>${q.options.map(o=>`<button class="choice ${q.selected!==null?(o.id===c.id?'correct':o.id===q.selected?'wrong':''):''}" ${q.selected!==null?'disabled':''} onclick="choose('${esc(o.id)}')">${esc(o.text)}</button>`).join('')}${q.selected!==null?`<p>${q.selected===c.id?'✓ Chính xác!':'✕ Chưa đúng.'} <strong>${esc(c.en)}</strong> — ${esc(c.vi)}</p><p class="muted">${esc(c.ex)}</p>${audioControls("c",c)}<button class="wide" onclick="nextQ()">${q.index===q.ids.length-1?'Xem kết quả':'Câu tiếp theo'}</button>`:''}</div>`};function choose(id){let q=session;if(q.selected!==null)return;q.selected=id;let c=data.cards.find(x=>x.id===q.ids[q.index]),ok=id===c.id;c.seen++;if(ok){q.score++;c.correct++;c.level=Math.min(5,c.level+1)}else c.level=0;c.due=plusDays(ok?[1,3,7,14,30][c.level-1]:1);data.history.push({date:today(),id:c.id,ok,mode:'quiz'});save();render()};function nextQ(){session.index++;session.selected=null;session.options=null;session.dir=session.dir==='en'?'vi':'en';render()};
function renderWords(a){a.innerHTML=`<div class="card"><h2>Thêm từ mới</h2><label>Từ / cấu trúc tiếng Anh</label><input id="en" placeholder="e.g. acknowledge feelings"><label>Nghĩa tiếng Việt</label><input id="vi" placeholder="Thừa nhận cảm xúc"><label>Ví dụ ngắn (không bắt buộc)</label><input id="ex" placeholder="I acknowledge her feelings."><label>Nhóm từ</label><select id="group"><option>Parenting English</option><option>IVF Research English</option><option>Daily English</option></select><button class="wide" onclick="addWord()">＋ Lưu từ mới</button></div><div class="card"><div class="row"><h2>Kho từ (${data.cards.length})</h2><button class="secondary" onclick="exportData()">Xuất sao lưu</button></div><input id="filter" placeholder="Tìm từ..." oninput="filterWords()"><div id="wordList"></div></div><div class="card"><h2>Khôi phục dữ liệu</h2><p class="muted">Nhập tệp JSON đã xuất trước đó. Thao tác này thay thế dữ liệu hiện tại.</p><input type="file" id="restore" accept="application/json,.json"><button class="ghost wide" onclick="importData()">Nhập bản sao lưu</button></div>`;filterWords()};function filterWords(){let el=document.getElementById('wordList');if(!el)return;let term=(document.getElementById('filter').value||'').toLowerCase();el.innerHTML=data.cards.filter(c=>(c.en+' '+c.vi+' '+c.group).toLowerCase().includes(term)).map(c=>`<div class="word"><div class="row"><div><strong>${esc(c.en)}</strong><small>${esc(c.vi)} · ${esc(c.group)}</small>${c.ex?`<small style="display:block;margin-top:4px">${esc(c.ex)}</small>`:""}${visualFor(c)}${audioControls("c",c)}</div><button class="ghost small" onclick="removeWord('${esc(c.id)}')">Xóa</button></div></div>`).join('')||'<p>Không có từ phù hợp.</p>'};function addWord(){let en=document.getElementById('en').value.trim(),vi=document.getElementById('vi').value.trim(),ex=document.getElementById('ex').value.trim(),group=document.getElementById('group').value;if(!en||!vi)return alert('Vui lòng nhập từ và nghĩa.');if(data.cards.some(c=>c.en.toLowerCase()===en.toLowerCase()&&c.group===group))return alert('Từ này đã có trong nhóm.');data.cards.push({id:'user-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),en,vi,ex,group,due:today(),level:0,seen:0,correct:0});save();render();alert('Đã thêm từ mới!')};function removeWord(id){if(!confirm('Xóa từ này khỏi kho?'))return;data.cards=data.cards.filter(c=>c.id!==id);save();render()};function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-english-quiz-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function importData(){let file=document.getElementById('restore').files[0];if(!file)return alert('Chọn tệp sao lưu JSON.');if(!confirm('Thay thế toàn bộ dữ liệu hiện tại?'))return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!Array.isArray(d.cards)||!d.cards.every(c=>typeof c.en==='string'&&typeof c.vi==='string'))throw Error();data={cards:d.cards,history:Array.isArray(d.history)?d.history:[]};save();render();alert('Khôi phục thành công.')}catch{alert('Tệp không hợp lệ.')}};reader.readAsText(file)}render();


// English pronunciation and shadowing: uses the iPhone's built-in speech synthesis.
let speechRun=0, speechPause=null;
function stopSpeech(){
  speechRun++;
  if(speechPause){clearTimeout(speechPause);speechPause=null;}
  if('speechSynthesis' in window)window.speechSynthesis.cancel();
  document.querySelectorAll('.listen-note').forEach(n=>n.textContent='Đã dừng.');
}
function audioControls(prefix,c){
  const id=JSON.stringify(String(c.id)).replace(/"/g,'&quot;');
  return `<div class="listen-actions">
    <button class="secondary" onclick="playCardText(${id},'word')">🔊 Từ</button>
    ${c.ex?`<button class="secondary" onclick="playCardText(${id},'example')">🔊 Ví dụ</button><button onclick="shadowCard(${id})">🎧 Shadowing</button>`:''}
    <button class="ghost" onclick="stopSpeech()">■ Dừng</button>
  </div><div class="listen-note" id="listen-${esc(c.id)}"></div>`;
}
function voiceForEnglish(){
  const voices=window.speechSynthesis.getVoices();
  return voices.find(v=>v.lang.toLowerCase()==='en-us'&&/samantha|ava|allison/i.test(v.name))
    || voices.find(v=>v.lang.toLowerCase()==='en-us')
    || voices.find(v=>v.lang.toLowerCase().startsWith('en'))||null;
}
function speakStep(text,rate,run,done){
  if(run!==speechRun)return;
  if(!text){done?.();return;}
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang='en-US';utterance.rate=rate;utterance.pitch=1;
  const voice=voiceForEnglish();if(voice)utterance.voice=voice;
  utterance.onend=()=>{if(run===speechRun)done?.();};
  utterance.onerror=()=>{if(run===speechRun)done?.();};
  window.speechSynthesis.speak(utterance);
}
function setSpeechNote(id,message){
  const node=document.getElementById('listen-'+id);
  if(node)node.textContent=message;
}
function playCardText(id,kind){
  const c=data.cards.find(x=>String(x.id)===String(id));if(!c)return;
  if(!('speechSynthesis' in window))return alert('Trình duyệt chưa hỗ trợ giọng đọc.');
  stopSpeech();const run=speechRun;
  const text=kind==='example'?c.ex:c.en;
  setSpeechNote(id,kind==='example'?'Đang đọc câu ví dụ…':'Đang đọc từ…');
  speakStep(text,0.9,run,()=>setSpeechNote(id,'Đã đọc xong.'));
}
function shadowCard(id){
  const c=data.cards.find(x=>String(x.id)===String(id));if(!c?.ex)return;
  if(!('speechSynthesis' in window))return alert('Trình duyệt chưa hỗ trợ giọng đọc.');
  stopSpeech();const run=speechRun;
  const pause=(message,ms,next)=>{
    if(run!==speechRun)return;
    setSpeechNote(id,message);
    speechPause=setTimeout(()=>{speechPause=null;if(run===speechRun)next();},ms);
  };
  setSpeechNote(id,'1/3 · Nghe tốc độ tự nhiên');
  speakStep(c.ex,0.95,run,()=>{
    pause('2/3 · Nghe chậm…',500,()=>{
      speakStep(c.ex,0.72,run,()=>{
        pause('Đến lượt chị nhắc lại câu (3 giây)…',3000,()=>{
          setSpeechNote(id,'3/3 · Nghe lại tốc độ tự nhiên');
          speakStep(c.ex,0.95,run,()=>setSpeechNote(id,'Hoàn thành! Có thể nhấn Shadowing để luyện lại.'));
        });
      });
    });
  });
}

const VOCAB_API = 'https://script.google.com/macros/s/AKfycbzmroLK7R-V5M9rQYxKKTZRWG6FhaF5iBhZ9kR0ITJYNna3CMQtkawobY6ZWVSze0sh/exec';

function syncVocabulary() {
  const old = document.getElementById('vocab-sync-script');
  if (old) old.remove();
  window.receiveVocabulary = function(response) {
    const words = Array.isArray(response?.words) ? response.words : [];
    let added = 0, updated = 0;
    words.forEach(w => {
      if (!w.front || !w.back) return;
      const normalize = s => String(s || '').toLowerCase().trim().replace(/[’‘]/g, "'");
      const existing = data.cards.find(c => normalize(c.en) === normalize(w.front));
      if (existing) {
        if (w.example && existing.ex !== w.example) { existing.ex = w.example; updated++; }
        return;
      }
      data.cards.push({id:'sheet-'+Date.now()+'-'+Math.random().toString(36).slice(2),en:w.front,vi:w.back,ex:w.example||'',group:w.topic||'Parenting English',due:today(),level:0,seen:0,correct:0});
      added++;
    });
    if (added || updated) { save(); render(); }
    document.getElementById('vocab-sync-script')?.remove();
    console.log('Vocabulary sync:', added, 'new words,', updated, 'examples updated');
  };
  const script = document.createElement('script');
  script.id = 'vocab-sync-script';
  script.src = VOCAB_API + '?callback=receiveVocabulary&t=' + Date.now();
  script.onerror = () => console.warn('Vocabulary sync unavailable');
  document.body.appendChild(script);
}
window.addEventListener('load', syncVocabulary);

</script></body></html>
